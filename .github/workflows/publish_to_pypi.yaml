name: Build and publish Python distributions to PyPI
on:
  release:
    types: [published]

jobs:

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # Build only supported CPython versions.
+          CIBW_BUILD: "cp311-* cp312-*"
+          CIBW_SKIP: "pp* *i686 *musllinux*"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - name: git checkout repository main
      uses: actions/checkout@v4

    - name: check github reference for tags
      run: |
        echo "github.ref = ${{ github.ref }}, github.ref_type = ${{ github.ref_type }}"
        echo "github.repository = ${{ github.repository }}, github.event_name = ${{ github.event_name }} "

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pypa/build
      run: python -m pip install build --user

    - name: Build a source tarball
      run: python -m build --sdist --outdir dist/ .

    - name: Upload source distribution
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: ./dist/*.tar.gz

  pypi-publish:
    needs: ['build_wheels', 'make_sdist']
    environment: 'publish'

    name: upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true


      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
