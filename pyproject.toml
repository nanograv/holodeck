[build-system]
# cython/numpy/scipy are required to build cython extensions.  The build steps are specified in `setup.py`
requires = ["setuptools >= 40.6.0", "wheel", "Cython<3.0.0", "numpy", "scipy"]
build-backend = "setuptools.build_meta"

[project]
name = "holodeck-gw"
description = "holodeck: Massive Black-Hole Binary Population Synthesis for Gravitational Wave Calculations ≋●≋●≋"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT" }
authors = [
    { name = "NANOGrav" }
]
dependencies = [
    "cosmopy>=3.6,<4",
    "matplotlib-label-lines>=0.8.1,<0.9"
]
dynamic = ["version"]

[project.scripts]
holodeck_lib_gen = "holodeck.librarian.gen_lib:main"
holodeck_fit_spec = "holodeck.librarian.fit_spectra:main"

[tool.mypy]
allow_redefinition = true

[tool.ruff]
exclude = [
    ".git",
    ".tox",
    "__pycache__",
    "build",
    "converted_notebooks",
    "dist",
    "data",
    "docs",
    "notebooks",
    "notebooks/dev",
    "scripts",
    "venv",
    "pyproject.toml",
]
ignore = [
    # "D416",  # is too complex (17)
    # "C901",  # is too complex (17)
    # "E722",    # do not use bare 'except'
    "E731",    # do not assign a lambda expression, use a def
    # "F401",  # imported but unused
    # "W605",     # invalid escape sequence [e.g. '\s'] :: can be caused by inline sphinx latex math
]
line-length = 140
select = [
    "C9",
    # "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",
]

[tool.ruff.mccabe]
max-complexity = 15
[tool.pixi.workspace]
name = "holodeck"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }
docs = {features = ["dev", "docs"], solve-group = "default" }

[tool.pixi.dependencies]
python = ">=3.9,<3.13"
astropy = ">=7.2.0,<8"
h5py = ">=3.16.0,<4"
ipywidgets = ">=8.1.8,<9"
kalepy = ">=1.4.3,<2"
matplotlib = ">=3.10.9,<4"
numpy = ">=2.4.6,<3"
scipy = ">=1.17.1,<2"
psutil = ">=7.2.2,<8"
tqdm = ">=4.67.3,<5"
cython = "<3"
schwimmbad = ">=0.4.2,<0.5"
emcee = ">=3.1.6,<4"
george = ">=0.4.4,<0.5"

[tool.pixi.pypi-dependencies]
holodeck-gw = { path = ".", editable = true }

[tool.pixi.tasks]
build = { cmd = "python setup.py build_ext -i", default-environment = "dev", description = "Compile Cython extensions in-place for active development." }

# Linting
lint = { cmd = "flake8", default-environment = "dev", description = "Run style and syntax checks using flake8 via tox.ini." }
lint-check = { cmd = "flake8 --statistics --count", default-environment = "dev", description = "Run flake8 check and output error counts/stats." }

# Testing
test = { cmd = "pytest --ignore=holodeck/tests/converted_notebooks/", default-environment = "dev", description = "Run fast local unit tests, skiping slow notebooks." }
test-all = { cmd = "tox", default-environment = "dev", description = "Run full test matrix, notebook conversions, via Tox." }
test-local = { cmd = "tox -e py312", default-environment = "dev", description = "Run localized full test suite on Python 3.12 only." }

# Convenience
notebook = { cmd = "jupyter notebook --notebook-dir=notebooks", default-environment = "dev", description = "Launch the Jupyter server anchored to notebooks/ dir." }

# Documentation subtasks
doc-clean = { cmd = "rm -f readthedocs.html ; sphinx-build -M clean source build", default-environment = "docs", cwd = "docs", description = "Wipe Sphinx build directories and local symlinks." }
doc-apidoc = { cmd = "sphinx-apidoc -e -P -T -f -o ./source/apidoc_modules ../holodeck", default-environment = "docs", cwd = "docs", description = "Generate API reference source files recursively." }
doc-html = { cmd = "sphinx-build -M html source build -v -T -j auto", default-environment = "docs", cwd = "docs", description = "Compile source doc files into html via parallel build." }
doc-link = { cmd = "ln -sf ./build/html/index.html readthedocs.html", default-environment = "docs", cwd = "docs", description = "Create local shortcut symlink to compiled html index." }

[tool.pixi.tasks.docs]
depends-on = [
    { task = "doc-clean", environment = "docs" },
    { task = "doc-apidoc", environment = "docs" },
    { task = "doc-html", environment = "docs" },
    { task = "doc-link", environment = "docs" }
]
description = "Run full doc pipeline: clean, apidoc, and html build."

[tool.pixi.feature.dev.dependencies]
flake8 = "*"
jupyter = "*"
nbconvert = "*"
nbstripout = "*"
pytest = "*"
pytest-cov = "*"
tox = "*"
memray = "*"

[tool.pixi.feature.docs.dependencies]
ipykernel = "*"
nbsphinx = "*"
numpydoc = ">=1.7.0"
sphinx = "*"
sphinx-math-dollar = "*"
sphinx-rtd-theme = "*"
